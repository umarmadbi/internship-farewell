<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>See you around!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Name entry overlay (skipped automatically if ?name= is in the URL) -->
  <div id="name-gate" class="gate">
    <div class="gate-card">
      <p class="gate-eyebrow">One last thing before I go</p>
      <h1 class="gate-title">Who am I waving at?</h1>
      <input id="name-input" class="gate-input" type="text" placeholder="Type your name…" maxlength="24" autocomplete="off">
      <button id="name-submit" class="gate-button">Let's go →</button>
    </div>
  </div>

  <main class="stage" id="stage" aria-hidden="true">

    <!-- Background scene. Sized/cropped by JS (fitScene in script.js) so the
         plant, logo and floor line are never clipped, on any screen shape. -->
    <svg id="scene-svg" class="scene" viewBox="0 0 760 620" xmlns="http://www.w3.org/2000/svg">
      <!-- sky / window glow -->
      <rect x="-200" y="0" width="1400" height="620" fill="url(#skyGrad)"/>
      <!-- window mullions -->
      <g stroke="#B9C6CE" stroke-width="4" opacity="0.55">
        <line x1="120" y1="0" x2="120" y2="430"/>
        <line x1="300" y1="0" x2="300" y2="430"/>
        <line x1="700" y1="0" x2="700" y2="430"/>
        <line x1="880" y1="0" x2="880" y2="430"/>
        <line x1="-200" y1="230" x2="1200" y2="230"/>
      </g>
      <!-- distant skyline silhouettes through the glass -->
      <g fill="#AFC6D6" opacity="0.55">
        <rect x="30" y="120" width="50" height="200"/>
        <rect x="150" y="60" width="60" height="260"/>
        <rect x="740" y="90" width="55" height="230"/>
        <rect x="820" y="150" width="45" height="170"/>
      </g>

      <!-- slow-drifting clouds, glimpsed through the glass -->
      <g class="cloud cloud-1" fill="#FFFFFF" opacity="0.65">
        <ellipse cx="0" cy="0" rx="38" ry="16"/>
        <ellipse cx="-28" cy="6" rx="24" ry="12"/>
        <ellipse cx="30" cy="8" rx="26" ry="12"/>
      </g>
      <g class="cloud cloud-2" fill="#FFFFFF" opacity="0.55">
        <ellipse cx="0" cy="0" rx="30" ry="13"/>
        <ellipse cx="-22" cy="5" rx="19" ry="10"/>
        <ellipse cx="24" cy="6" rx="21" ry="10"/>
      </g>
      <g class="cloud cloud-3" fill="#FFFFFF" opacity="0.6">
        <ellipse cx="0" cy="0" rx="34" ry="14"/>
        <ellipse cx="-25" cy="5" rx="21" ry="11"/>
        <ellipse cx="27" cy="7" rx="23" ry="11"/>
      </g>

      <!-- floor -->
      <rect x="-200" y="430" width="1400" height="190" fill="url(#floorGrad)"/>
      <line x1="-200" y1="430" x2="1200" y2="430" stroke="#CFC7B8" stroke-width="3"/>

      <!-- back desk, kept quiet on the right so the character owns the scene -->
      <g opacity="0.9">
        <rect x="760" y="360" width="190" height="14" rx="4" fill="#C9BFA6"/>
        <rect x="775" y="374" width="10" height="46" fill="#B8AD90"/>
        <rect x="920" y="374" width="10" height="46" fill="#B8AD90"/>
        <rect x="800" y="300" width="70" height="52" rx="4" fill="#3A3F44"/>
        <rect x="806" y="306" width="58" height="36" rx="2" fill="#6FA3C7"/>
        <rect x="825" y="352" width="20" height="8" fill="#3A3F44"/>
        <path d="M885 420 q20 -60 40 0 z" fill="#4A4F44" opacity="0.85"/>
        <ellipse cx="905" cy="420" rx="35" ry="7" fill="#00000010"/>
        <g transform="translate(870,380)">
          <rect x="0" y="30" width="46" height="6" rx="3" fill="#2B2F33"/>
          <rect x="6" y="0" width="34" height="34" rx="6" fill="#2B2F33"/>
          <circle cx="23" cy="36" r="9" fill="#1D2023"/>
        </g>
      </g>

      <!-- signature element: the round planter, echoing the real office photo -->
      <g transform="translate(480,300)">
        <rect x="-38" y="70" width="76" height="90" rx="10" fill="#EDEAE2" stroke="#D8D2C2" stroke-width="2"/>
        <ellipse cx="0" cy="70" rx="38" ry="9" fill="#DAD4C4"/>
        <path d="M0 70 C -30 20 -10 -30 0 -55 C 10 -30 30 20 0 70 Z" fill="#3E7D6C"/>
        <path d="M0 70 C 20 30 30 -10 8 -48" fill="none" stroke="#2E5F52" stroke-width="4"/>
        <path d="M0 70 C -22 20 -18 -20 -4 -50" fill="none" stroke="#2E5F52" stroke-width="4"/>
        <ellipse cx="0" cy="163" rx="46" ry="8" fill="#00000012"/>
      </g>

      <!-- company logo, sitting just above the plant like office signage -->
      <g transform="translate(450,150)" opacity="0.94">
        <g transform="scale(0.6)">
          <path d="M0 -34 A17 17 0 0 1 17 -17 A17 17 0 0 1 0 0 A17 17 0 0 1 -17 -17 A17 17 0 0 1 0 -34 Z" fill="#2F6F6B"/>
          <path d="M0 34 A17 17 0 0 1 17 17 A17 17 0 0 1 0 0 A17 17 0 0 1 -17 17 A17 17 0 0 1 0 34 Z" fill="#2F6F6B"/>
          <path d="M-34 0 A17 17 0 0 1 -17 -17 A17 17 0 0 1 0 0 A17 17 0 0 1 -17 17 A17 17 0 0 1 -34 0 Z" fill="#2F6F6B"/>
          <path d="M34 0 A17 17 0 0 1 17 17 A17 17 0 0 1 0 0 A17 17 0 0 1 17 -17 A17 17 0 0 1 34 0 Z" fill="#2F6F6B"/>
        </g>
        <text x="46" y="9" font-family="Fredoka, sans-serif" font-size="30" font-weight="700" fill="#24303A">MSD</text>
      </g>

      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#EAF3F8"/>
          <stop offset="100%" stop-color="#D7E6EE"/>
        </linearGradient>
        <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#EFEBE1"/>
          <stop offset="100%" stop-color="#E3DDCC"/>
        </linearGradient>
      </defs>
    </svg>

    <!-- Character -->
    <div class="character" id="character">
      <div class="shadow" id="char-shadow"></div>
      <img class="body" src="assets/character.png" alt="Cartoon avatar waving" draggable="false">
      <div class="wave-hand" id="wave-hand">👋</div>

      <div class="bubble" id="bubble">
        <span id="bubble-text">Hi there!</span>
      </div>
    </div>

    <!-- Progress dots -->
    <div class="dots" id="dots" aria-hidden="true"></div>

    <!-- Advance button -->
    <button class="next-btn" id="next-btn" aria-label="Next message">&raquo;</button>

    <!-- End-of-sequence actions -->
    <div class="end-actions" id="end-actions">
      <button class="replay-btn" id="replay-btn" aria-label="Play again">↺ Watch again</button>
      <button class="card-btn" id="card-btn" aria-label="Save as one card">📄 Save as one card</button>
    </div>
  </main>

  <!-- Full letter, compiled from every bubble, viewable / downloadable as one card -->
  <div class="card-overlay" id="card-overlay">
    <div class="letter-card" id="letter-card">
      <img class="letter-avatar" src="assets/character.png" alt="">
      <p class="letter-eyebrow" id="letter-eyebrow">A note before I go</p>
      <div class="letter-body" id="letter-body"></div>
    </div>
    <div class="card-overlay-actions">
      <button class="card-action" id="download-card-btn">⬇ Download image</button>
      <button class="card-action ghost" id="close-card-btn">Close</button>
    </div>
  </div>

  <canvas id="confetti"></canvas>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="messages.js"></script>
  <script src="script.js"></script>
</body>
</html>
